[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Wave 0 spike only: Wasmtime 45.0.3 is the newest line compatible with the
# pinned Rust 1.93.0 toolchain. RUSTSEC-2026-0222 (GHSA-hgjw-h833-99q9) has no
# 45.x patch; 46+/47+ require Rust 1.94. The spike crate is throwaway and never
# linked into junban-server. Wave 2 product host must re-evaluate the pin or
# toolchain before shipping junban-plugin-host.
ignore = [
  { id = "RUSTSEC-2026-0222", reason = "Phase 7 Wave 0 temporary spike only; Wasmtime 45.0.3 frozen for Rust 1.93.0, no 45.x advisory patch, not linked into junban-server" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
