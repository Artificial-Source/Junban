[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"
repository = "https://github.com/Artificial-Source/Junban"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.5.60", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
futures-core = { version = "0.3.32", default-features = false, features = ["std"] }
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.0", default-features = false, features = ["fs"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
utoipa = { version = "5.5.0", default-features = false, features = ["jiff_0_2", "macros", "uuid"] }
uuid = { version = "1.24.0", default-features = false, features = ["rng-getrandom", "serde", "std", "v4", "v7"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
# Unsafe code needs an explicit, reviewed exception rather than an irreversible workspace ban.
unsafe_code = "deny"

[workspace.lints.clippy]
# Default Clippy set as warnings; CI denies warnings. Avoid pedantic/nursery noise.
all = { level = "warn", priority = -1 }
