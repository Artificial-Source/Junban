name: Phase 7 Slice 2E cgroup-v2 memory calibration

on:
  workflow_dispatch:
  push:
    branches:
      - "phase7-slice2e-memory-calibration/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: Calibrate real composition (Linux cgroup v2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.93.0"

      - name: Delegate an isolated cgroup-v2 parent
        shell: bash
        run: |
          set -euo pipefail
          membership="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          current="/sys/fs/cgroup${membership%/}"
          candidate="${current}"
          delegated_from=""
          while [[ "${candidate}" == /sys/fs/cgroup* ]]; do
            parent_candidate="$(dirname "${candidate}")"
            if [[ -f "${candidate}/cgroup.subtree_control" ]] && \
              [[ -f "${parent_candidate}/cgroup.subtree_control" ]] && \
              grep -qw memory "${parent_candidate}/cgroup.subtree_control"; then
              delegated_from="${candidate}"
              break
            fi
            [[ "${candidate}" == /sys/fs/cgroup ]] && break
            candidate="${parent_candidate}"
          done
          if [[ -z "${delegated_from}" ]]; then
            echo "no cgroup-v2 ancestor receives the delegated memory controller" >&2
            exit 1
          fi
          parent="${delegated_from}/junban-slice2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "${parent}"
          echo "JUNBAN_SLICE2E_CGROUP_PARENT=${parent}" >> "${GITHUB_ENV}"
          sudo test -f "${parent}/memory.current"
          sudo test -f "${parent}/memory.peak"
          sudo chown "$(id -u):$(id -g)" \
            "${parent}" "${parent}/cgroup.procs" "${parent}/cgroup.threads" \
            "${parent}/cgroup.subtree_control"

      - name: Run five samples for baseline and each language/scale
        env:
          JUNBAN_SLICE2E_CGROUP_PARENT: ${{ env.JUNBAN_SLICE2E_CGROUP_PARENT }}
        shell: bash
        run: |
          set -euo pipefail
          sudo env "PATH=${PATH}" "HOME=${HOME}" \
            python3 scripts/calibrate-phase7-slice2e-cgroup.py \
            --privileged-cgroup-migration \
            --idle-host-confirmed \
            --output "${{ runner.temp }}/phase7-slice2e-cgroup-memory.json"

      - name: Remove delegated cgroup parent
        if: always()
        shell: bash
        run: |
          if [[ -n "${JUNBAN_SLICE2E_CGROUP_PARENT:-}" ]] && \
            [[ -d "${JUNBAN_SLICE2E_CGROUP_PARENT}" ]]; then
            while IFS= read -r -d "" child; do
              if ! grep -qx "populated 0" "${child}/cgroup.events"; then
                echo "delegated calibration child remains populated: ${child}" >&2
                exit 1
              fi
              sudo rmdir "${child}"
            done < <(find "${JUNBAN_SLICE2E_CGROUP_PARENT}" -mindepth 1 -maxdepth 1 \
              -type d -print0)
            if find "${JUNBAN_SLICE2E_CGROUP_PARENT}" -mindepth 1 -maxdepth 1 \
              -type d -print -quit | grep -q .; then
              echo "delegated cgroup retains child cgroups" >&2
              exit 1
            fi
            sudo rmdir "${JUNBAN_SLICE2E_CGROUP_PARENT}"
          fi

      - name: Upload raw calibration JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-slice2e-cgroup-memory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase7-slice2e-cgroup-memory.json
          if-no-files-found: warn
          retention-days: 14
