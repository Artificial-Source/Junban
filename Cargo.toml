[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"
repository = "https://github.com/Artificial-Source/Junban"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc", "std"] }
clap = { version = "4.6.10", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = { version = "0.13.0", default-features = false }
jiff = { version = "1.0.3", default-features = false, features = ["serde", "std", "tz-system"] }
libc = { version = "0.2.191", default-features = false }
proptest = "1.12"
rayon = "=1.12.0"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = { version = "1.0.28", features = ["serde"] }
spdx = "0.13.6"
sha2 = { version = "0.11.2", default-features = false }
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
utoipa = { version = "6.0.0", default-features = false, features = ["jiff_0_2", "macros", "uuid"] }
uuid = { version = "1.29.3", default-features = false, features = ["rng-getrandom", "serde", "std", "v4", "v7"] }
wasmparser = { version = "=0.263.0", default-features = false, features = ["std", "features", "component-model", "validate"] }
wasmtime = { version = "=36.0.23", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "parallel-compilation"] }
wasmtime-wasi = { version = "=36.0.23", default-features = false }
wit-parser = { version = "=0.263.0", default-features = false, features = ["decoding"] }
windows-sys = { version = "=0.61.2", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
# Unsafe code needs an explicit, reviewed exception rather than an irreversible workspace ban.
unsafe_code = "deny"

[workspace.lints.clippy]
# Default Clippy set as warnings; CI denies warnings. Avoid pedantic/nursery noise.
all = { level = "warn", priority = -1 }
