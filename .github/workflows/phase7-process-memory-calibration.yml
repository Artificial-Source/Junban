name: Phase 7 process-memory calibration

on:
  workflow_dispatch:
  push:
    branches:
      - "phase7-process-memory-calibration/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: Calibrate plugin host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.93.0"

      - name: Build exact optimized plugin host
        run: cargo build --locked --release -p junban-plugin-host

      - name: Run warm-up and five measured samples per profile
        shell: bash
        env:
          JUNBAN_PLUGIN_MEMORY_CALIBRATION: "1"
          JUNBAN_PLUGIN_MEMORY_CALIBRATION_OUTPUT: ${{ runner.temp }}/phase7-process-memory-calibration.json
        run: >-
          cargo test --locked --release -p junban-plugin-host
          --test process_memory_calibration calibration_campaign --
          --ignored --exact --test-threads=1

      - name: Upload raw calibration JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-process-memory-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase7-process-memory-calibration.json
          if-no-files-found: warn
          retention-days: 14
