name: Phase 7 Wave 5 integrated performance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure optimized plugin product (Linux cgroup v2)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch exact Phase 6 comparison authority
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            refs/tags/phase-6-wave-5-base:refs/tags/phase-6-wave-5-base
          test "$(git rev-parse 6401108b31e7768048d154c8b14662bb3a2e9bb1^{tree})" = \
            "13edb8869d2a01a3b8a33dc0f57a97bb64cdf94f"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          targets: wasm32-wasip2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.29.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install exact build tools
        shell: bash
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"
          pnpm install --frozen-lockfile

      - name: Prepare zero-swap user cgroup authority
        shell: bash
        run: |
          sudo swapoff --all
          test "$(awk '/^SwapTotal:/ { print $2 }' /proc/meminfo)" = "0"
          systemctl --user show-environment >/dev/null
          test -f /sys/fs/cgroup/cgroup.controllers
          grep -qw memory /sys/fs/cgroup/cgroup.controllers

      - name: Collect and verify authoritative Wave 5 reports
        shell: bash
        run: |
          results="${RUNNER_TEMP}/phase7-wave5-performance"
          mkdir -p "${results}"
          if ! python3 scripts/check-phase7-wave5-performance.py \
            --collect --authoritative --build-base \
            --output-dir "${results}"; then
            printf '%s\n' 'Collection failed; inspect the job log.' >"${results}/collection-failed.txt"
            exit 1
          fi
          python3 scripts/check-phase7-wave5-performance.py \
            --check-evidence "${results}"

      - name: Upload authoritative performance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase7-wave5-performance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase7-wave5-performance
          if-no-files-found: error
          retention-days: 14
