[package]
name = "junban-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Single-owner SQLite persistence for Junban"
publish = false

[features]
default = []
# Development-only 10k-task scale fixture. Not enabled by junban-server.
scale-bench = []

[dependencies]
fs4.workspace = true
jiff.workspace = true
junban-app = { path = "../junban-app", version = "0.1.0" }
junban-domain = { path = "../junban-domain", version = "0.1.0" }
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
uuid.workspace = true

[[bin]]
name = "junban-scale-seed"
path = "src/bin/junban-scale-seed.rs"
required-features = ["scale-bench"]

[lints]
workspace = true
