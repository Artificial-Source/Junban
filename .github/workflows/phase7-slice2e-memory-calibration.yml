name: Phase 7 Slice 2E cgroup-v2 memory calibration

on:
  workflow_dispatch:
  push:
    branches:
      - "phase7-slice2e-memory-calibration/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: Calibrate real composition (Linux cgroup v2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.93.0"

      - name: Delegate an isolated cgroup-v2 parent
        shell: bash
        run: |
          set -euo pipefail
          membership="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          current="/sys/fs/cgroup${membership%/}"
          delegate=""
          candidate="${current}"
          while [[ "${candidate}" == /sys/fs/cgroup* ]]; do
            if [[ -f "${candidate}/cgroup.subtree_control" ]] && \
              grep -qw memory "${candidate}/cgroup.subtree_control"; then
              delegate="${candidate}"
              break
            fi
            [[ "${candidate}" == /sys/fs/cgroup ]] && break
            candidate="$(dirname "${candidate}")"
          done
          if [[ -z "${delegate}" ]]; then
            echo "no cgroup-v2 ancestor delegates the memory controller" >&2
            exit 1
          fi
          parent="${delegate}/junban-slice2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "${parent}"
          echo "JUNBAN_SLICE2E_CGROUP_PARENT=${parent}" >> "${GITHUB_ENV}"
          grep -qw memory "${parent}/cgroup.controllers"
          echo +memory | sudo tee "${parent}/cgroup.subtree_control" >/dev/null
          sudo chown "$(id -u):$(id -g)" \
            "${parent}" "${parent}/cgroup.procs" "${parent}/cgroup.threads" \
            "${parent}/cgroup.subtree_control"

      - name: Run five samples for baseline and each language/scale
        env:
          JUNBAN_SLICE2E_CGROUP_PARENT: ${{ env.JUNBAN_SLICE2E_CGROUP_PARENT }}
        shell: bash
        run: |
          set -euo pipefail
          export JUNBAN_SLICE2E_UID="$(id -u)"
          export JUNBAN_SLICE2E_GID="$(id -g)"
          sudo --preserve-env=PATH,HOME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKSPACE,RUNNER_TEMP,JUNBAN_SLICE2E_CGROUP_PARENT,JUNBAN_SLICE2E_UID,JUNBAN_SLICE2E_GID \
            bash -c '
              gate="${RUNNER_TEMP}/phase7-slice2e-gate"
              rm -f "${gate}"
              mkfifo "${gate}"
              chown "${JUNBAN_SLICE2E_UID}:${JUNBAN_SLICE2E_GID}" "${gate}"
              JUNBAN_SLICE2E_PRECREATED_CGROUPS=1 \
                setpriv --reuid "${JUNBAN_SLICE2E_UID}" \
                --regid "${JUNBAN_SLICE2E_GID}" --init-groups \
                python3 -c "import os,sys; print(os.getpid(), flush=True); open(sys.argv[1], \"rb\").read(1); os.execv(sys.executable, [sys.executable, *sys.argv[2:]])" \
                "${gate}" scripts/calibrate-phase7-slice2e-cgroup.py \
                --idle-host-confirmed \
                --output "${{ runner.temp }}/phase7-slice2e-cgroup-memory.json" \
                > "${RUNNER_TEMP}/phase7-slice2e-calibration.log" 2>&1 &
              calibration_pid="$!"
              echo "${calibration_pid}" > "${JUNBAN_SLICE2E_CGROUP_PARENT}/cgroup.procs"
              for profile_scale in baseline:0 rust:1 rust:4 rust:16 typescript:1 typescript:4 typescript:16; do
                IFS=: read -r profile scale <<< "${profile_scale}"
                for sequence in 1 2 3 4 5; do
                  child="${JUNBAN_SLICE2E_CGROUP_PARENT}/junban-slice2e-${calibration_pid}-${profile}-${scale}-${sequence}"
                  mkdir "${child}"
                  chown "${JUNBAN_SLICE2E_UID}:${JUNBAN_SLICE2E_GID}" \
                    "${child}" "${child}/cgroup.procs" "${child}/cgroup.threads"
                  chmod u+rw "${child}/cgroup.procs" "${child}/cgroup.threads"
                done
              done
              printf x > "${gate}"
              if ! wait "${calibration_pid}"; then
                cat "${RUNNER_TEMP}/phase7-slice2e-calibration.log"
                exit 1
              fi
              cat "${RUNNER_TEMP}/phase7-slice2e-calibration.log"
              rm -f "${gate}" "${RUNNER_TEMP}/phase7-slice2e-calibration.log"
            '

      - name: Remove delegated cgroup parent
        if: always()
        shell: bash
        run: |
          if [[ -n "${JUNBAN_SLICE2E_CGROUP_PARENT:-}" ]] && \
            [[ -d "${JUNBAN_SLICE2E_CGROUP_PARENT}" ]]; then
            while IFS= read -r -d "" child; do
              if ! grep -qx "populated 0" "${child}/cgroup.events"; then
                echo "delegated calibration child remains populated: ${child}" >&2
                exit 1
              fi
              sudo rmdir "${child}"
            done < <(find "${JUNBAN_SLICE2E_CGROUP_PARENT}" -mindepth 1 -maxdepth 1 \
              -type d -print0)
            if find "${JUNBAN_SLICE2E_CGROUP_PARENT}" -mindepth 1 -maxdepth 1 \
              -type d -print -quit | grep -q .; then
              echo "delegated cgroup retains child cgroups" >&2
              exit 1
            fi
            sudo rmdir "${JUNBAN_SLICE2E_CGROUP_PARENT}"
          fi

      - name: Upload raw calibration JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-slice2e-cgroup-memory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase7-slice2e-cgroup-memory.json
          if-no-files-found: warn
          retention-days: 14
