[package]
name = "junban-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native Junban MCP stdio server"
publish = false

[[bin]]
name = "junban-mcp"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
junban-cli = { path = "../junban-cli", version = "0.1.0" }
junban-server = { path = "../junban-server", version = "0.1.0" }
rmcp = { version = "=3.1.0", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
fs4 = { workspace = true }
junban-server = { path = "../junban-server", version = "0.1.0" }
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true }

[lints]
workspace = true
